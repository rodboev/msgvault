      with:
        path: ${{ env.GO_CACHE_PATHS }}
        key: ${{ env.GO_CACHE_KEY }}
        lookup-only: true
    - name: Preserve candidate output when cache publication fails
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      shell: bash
      env:
        SNAPSHOT_GROUP: windows
      run: python3 .github/scripts/cache-measure-pack.py
    - name: Upload unpublished candidate cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: go-produced-99cc6603d8-windows
        path: ${{ runner.temp }}/produced-cache/*
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["candidate"]' || format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
    if: '(true) && (github.event_name != ''push'' || !startsWith(github.event.head_commit.message, ''ci: prepare cache publication'') && !startsWith(github.event.head_commit.message, ''ci: publish retained measurement caches''))'
  lint-windows:
    if: '(github.event_name != ''push'' && (inputs.subset == ''shared'' || inputs.subset == ''all'')) && (github.event_name != ''push'' || !startsWith(github.event.head_commit.message, ''ci: prepare cache publication'') && !startsWith(github.event.head_commit.message, ''ci: publish retained measurement caches''))'
    runs-on: windows-2025
    timeout-minutes: 64
    steps:
    - uses: actions/checkout@v7.0.1
    - *id002
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@main
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-windows
      if: matrix.variant == 'baseline'
    - name: Restore Go caches (candidate)
      uses: $/.github/actions/go-cache-restore
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-windows
      if: matrix.variant == 'candidate'
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install SQLite development headers
      shell: bash
      run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
    - name: Build custom linter
      shell: pwsh
      env: &id003
        CGO_ENABLED: '1'
        CGO_CFLAGS: -IC:/msys64/mingw64/include -fgnu89-inline
        CGO_LDFLAGS: -Wl,--allow-multiple-definition
        GOFLAGS: -buildvcs=false -trimpath
      run: |
        $version = (Select-String -Path .custom-gcl.yml -Pattern '^version: (\S+)').Matches[0].Groups[1].Value
        bash -c 'kit-retry 3 5 go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$1" custom --destination "$2" --name custom-gcl' -- "$version" "$env:RUNNER_TEMP"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Lint
      shell: pwsh
      env: *id003
      run: '& "$env:RUNNER_TEMP/custom-gcl.exe" run -v ./...'
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["candidate"]' || format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
  test-pgvector:
    if: '(github.event_name != ''push'' && (inputs.subset == ''shared'' || inputs.subset == ''all'')) && (github.event_name != ''push'' || !startsWith(github.event.head_commit.message, ''ci: prepare cache publication'') && !startsWith(github.event.head_commit.message, ''ci: publish retained measurement caches''))'
    runs-on: ubuntu-26.04
    timeout-minutes: 109
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: -c max_locks_per_transaction=256 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports:
        - 5432:5432
        options: --tmpfs /var/lib/postgresql/data:rw,size=4g --health-cmd "pg_isready -U msgvault_test -d msgvault_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:testpw@localhost:5432/msgvault_test
      MEASURE_VARIANT: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@v7.0.1
