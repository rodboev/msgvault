        retention-days: 14
        if-no-files-found: ignore
    - name: Print slowest tests
      if: always()
      shell: bash
      run: |
        for f in gotestsum/*.json; do
          [ -f "$f" ] || continue
          go tool gotestsum tool slowest --jsonfile "$f" --num 10 || true
        done
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: msgvault-windows-amd64-${{ matrix.variant }}
        path: msgvault.exe
    - name: Save Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-save@main
      if: matrix.variant == 'baseline'
    - name: Save Go caches (candidate)
      uses: $/.github/actions/go-cache-save
      if: matrix.variant == 'candidate'
    - name: Verify published candidate cache
      id: cache-published
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
