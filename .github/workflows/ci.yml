    - name: Preserve candidate output when cache publication fails
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      shell: bash
      env:
        SNAPSHOT_GROUP: linux-postgres
      run: python3 .github/scripts/cache-measure-pack.py
    - name: Upload unpublished candidate cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: go-produced-99cc6603d8-linux-postgres
        path: ${{ runner.temp }}/produced-cache/*
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["candidate"]' || format('["{0}"]', inputs.variant || 'candidate')) }}
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options:
        - baseline
        - candidate
        default: candidate
      subset:
        type: choice
        options:
        - core
        - shared
        - all
        default: core
      sample:
        type: string
        default: manual
  workflow_call:
    inputs:
      variant:
        type: string
        default: candidate
      subset:
        type: string
        default: core
      sample:
        type: string
        default: pr
run-name: Go cache ${{ inputs.variant || 'owners' }} / ${{ inputs.subset || 'all owners' }} / ${{ inputs.sample || 'seed' }}
