    runs-on: ubuntu-26.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: -c max_locks_per_transaction=256 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        ports:
        - 5432:5432
        options: --tmpfs /var/lib/postgresql:rw,size=4g --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
