    - name: Enable pgvector extension
      run: |
        docker exec "${{ job.services.postgres.id }}" \
          psql -U msgvault_test -d msgvault_test \
          -c "CREATE EXTENSION IF NOT EXISTS vector"
    - name: Test (pgvector-tagged)
      run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/pgvector.json --rerun-fails=2 --rerun-fails-report gotestsum/pgvector-reruns.txt --packages "./internal/vector/... ./internal/scheduler/..." -- -timeout 82m -p 4 -tags "fts5 sqlite_vec pgvector" -count=1
