    - name: Restore Go caches (candidate)
      uses: $/.github/actions/go-cache-restore
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-windows
        trim: 'true'
      if: matrix.variant == 'candidate'
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install SQLite development headers
      shell: bash
      run: kit-retry 3 5 C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
    - name: Build
      shell: pwsh
      env:
        CGO_ENABLED: '1'
        CGO_CFLAGS: -IC:/msys64/mingw64/include -fgnu89-inline
        CGO_LDFLAGS: -Wl,--allow-multiple-definition
      run: go build -tags "fts5 sqlite_vec" -o msgvault.exe ./cmd/msgvault
    - *id001
    - name: Test
      shell: pwsh
      env:
        CGO_ENABLED: '1'
        CGO_CFLAGS: -IC:/msys64/mingw64/include -fgnu89-inline
        CGO_LDFLAGS: -Wl,--allow-multiple-definition
      run: |
        $separatePackages = @(
          "go.kenn.io/msgvault/cmd/msgvault/cmd"
          "go.kenn.io/msgvault/internal/api"
          "go.kenn.io/msgvault/internal/importer"
          "go.kenn.io/msgvault/internal/store"
          "go.kenn.io/msgvault/internal/sync"
          "go.kenn.io/msgvault/internal/vector/embed"
          "go.kenn.io/msgvault/internal/vector/sqlitevec"
          "go.kenn.io/msgvault/scripts"
        )
        $packages = go list -tags "fts5 sqlite_vec" ./... |
          Where-Object { $_ -notin $separatePackages }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/windows.json --rerun-fails=2 --rerun-fails-report gotestsum/windows-reruns.txt `
