name: Go cache measurements
permissions:
  contents: read
  actions: read
env:
  GOPROXY: https://proxy.golang.org|direct
  GOTRACEBACK: all
  GOFLAGS: -trimpath
jobs:
  checks:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
      MEASURE_VARIANT: ${{ matrix.variant }}
    if: '(github.event_name == ''push'' || inputs.subset == ''all'') && (github.event_name != ''push'' || !startsWith(github.event.head_commit.message, ''ci: prepare cache publication'') && !startsWith(github.event.head_commit.message, ''ci: publish retained measurement caches''))'
    runs-on: ubuntu-26.04
    timeout-minutes: 37
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free measurement space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Download identical upstream snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/download-artifact@v8.0.1
      with:
        repository: kenn-io/msgvault
        run-id: 42398968927
        github-token: ${{ github.token }}
        name: go-snapshot-linux-checks
        path: ${{ runner.temp }}/snapshot
    - name: Seed owner directories from snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        SNAPSHOT_GROUP: linux-checks
      run: python3 .github/scripts/cache-measure-seed.py
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@main
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-linux-checks
        extra-path: .git/golangci-lint-cache
      if: matrix.variant == 'baseline'
    - name: Restore Go caches (candidate)
      uses: $/.github/actions/go-cache-restore
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-linux-checks
        trim: 'true'
        extra-path: .git/golangci-lint-cache
      if: matrix.variant == 'candidate'
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install SQLite development headers
      run: kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev
    - name: Check PostgreSQL build coverage
      run: make pg-shipped-only-check
    - name: Fetch Go checkers
      run: GOFLAGS="${GOFLAGS:+$GOFLAGS }-n" kit-retry 3 5 make huma-check lint-workflow-retries
    - name: Check Huma API contracts
      run: make huma-check
    - name: Install lint tools
      run: |
        make lint-tools
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Check OpenAPI artifacts
      run: make openapi-check
    - name: Check MCP guide
      run: make agent-guide-check
    - name: Lint
      run: |
        cache=$(git rev-parse --git-path golangci-lint-cache)
        cmp -s .custom-gcl.yml "$cache/.custom-gcl.yml" || rm -rf "$cache"
        mkdir -p "$cache"
        cp .custom-gcl.yml "$cache/.custom-gcl.yml"
        make lint-ci
    - name: Vulnerability check
      run: make vulncheck
    - name: Log cache sizes
      if: matrix.variant == 'baseline' && github.event_name != 'pull_request'
      run: du -sh "$(go env GOCACHE)" "$(go env GOMODCACHE)" "$(git rev-parse --git-path golangci-lint-cache)"
    - name: Save Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-save@main
      if: matrix.variant == 'baseline'
    - name: Save Go caches (candidate)
      uses: $/.github/actions/go-cache-save
      if: matrix.variant == 'candidate'
    - name: Verify published candidate cache
      id: cache-published
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.GO_CACHE_PATHS }}
        key: ${{ env.GO_CACHE_KEY }}
        lookup-only: true
    - name: Preserve candidate output when cache publication fails
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      shell: bash
      env:
        SNAPSHOT_GROUP: linux-checks
      run: python3 .github/scripts/cache-measure-pack.py
    - name: Upload unpublished candidate cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: go-produced-99cc6603d8-linux-checks
        path: ${{ runner.temp }}/produced-cache/*
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["candidate"]' || format('["{0}"]', inputs.variant || 'candidate')) }}
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 38
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free measurement space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Download identical upstream snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/download-artifact@v8.0.1
      with:
        repository: kenn-io/msgvault
        run-id: 42398968927
        github-token: ${{ github.token }}
        name: go-snapshot-linux-test
        path: ${{ runner.temp }}/snapshot
    - name: Seed owner directories from snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        SNAPSHOT_GROUP: linux-test
      run: python3 .github/scripts/cache-measure-seed.py
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@main
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-linux-test
      if: matrix.variant == 'baseline'
    - name: Restore Go caches (candidate)
      uses: $/.github/actions/go-cache-restore
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-linux-test
        trim: 'true'
      if: matrix.variant == 'candidate'
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install SQLite development headers
      run: kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev
    - &id001
      name: Stabilize tracked file times
      run: go run ./scripts/stable-mtimes
    - name: Test
      run: make test-unsharded TEST_TIMEOUT=17m
    - name: Check for test reruns
      if: always()
      id: check-unsharded-reruns
      shell: bash
      run: |
        if [ -s gotestsum/unsharded-reruns.txt ]; then
          echo "reruns=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload test events
      if: failure() || github.run_attempt > 1 || steps.check-unsharded-reruns.outputs.reruns == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-unsharded-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/unsharded.json
        retention-days: 14
        if-no-files-found: ignore
    - name: Test build without vector backends
      run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/vector-stub.json --rerun-fails=2 --rerun-fails-report gotestsum/vector-stub-reruns.txt --packages ./cmd/msgvault/cmd -- -timeout 5m -tags fts5 -run '^TestDocumentVectorStubKeepsStatusAvailableAndBuildActionable$' -count=1
    - name: Check for test reruns
      if: always()
      id: check-vector-stub-reruns
      shell: bash
      run: |
        if [ -s gotestsum/vector-stub-reruns.txt ]; then
          echo "reruns=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload test events
      if: failure() || github.run_attempt > 1 || steps.check-vector-stub-reruns.outputs.reruns == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-vector-stub-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/vector-stub.json
        retention-days: 14
        if-no-files-found: ignore
    - name: Save Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-save@main
      if: matrix.variant == 'baseline'
    - name: Save Go caches (candidate)
      uses: $/.github/actions/go-cache-save
      if: matrix.variant == 'candidate'
    - name: Verify published candidate cache
      id: cache-published
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.GO_CACHE_PATHS }}
        key: ${{ env.GO_CACHE_KEY }}
        lookup-only: true
    - name: Preserve candidate output when cache publication fails
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      shell: bash
      env:
        SNAPSHOT_GROUP: linux-test
      run: python3 .github/scripts/cache-measure-pack.py
    - name: Upload unpublished candidate cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: go-produced-99cc6603d8-linux-test
        path: ${{ runner.temp }}/produced-cache/*
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["candidate"]' || format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
    if: '(true) && (github.event_name != ''push'' || !startsWith(github.event.head_commit.message, ''ci: prepare cache publication'') && !startsWith(github.event.head_commit.message, ''ci: publish retained measurement caches''))'
  test-sharded:
    if: '(github.event_name != ''push'' && (inputs.subset == ''shared'' || inputs.subset == ''all'')) && (github.event_name != ''push'' || !startsWith(github.event.head_commit.message, ''ci: prepare cache publication'') && !startsWith(github.event.head_commit.message, ''ci: publish retained measurement caches''))'
    name: test-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["candidate"]' || format('["{0}"]', inputs.variant || 'candidate')) }}
        name:
        - cli
        - store
        - api
        include:
        - name: cli
          package: ./cmd/msgvault/cmd
          job_timeout: 22
          test_timeout: 15m
        - name: store
          package: ./internal/store
          job_timeout: 17
          test_timeout: 10m
        - name: api
          package: ./internal/api
          job_timeout: 13
          test_timeout: 5m
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.job_timeout }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free measurement space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@main
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-linux-test
      if: matrix.variant == 'baseline'
    - name: Restore Go caches (candidate)
      uses: $/.github/actions/go-cache-restore
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-linux-test
      if: matrix.variant == 'candidate'
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install test dependencies
      run: kit-retry 3 5 sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y libsqlite3-dev bubblewrap
    - name: Test package in isolated shards
      run: scripts/test-package-shards.sh "${{ matrix.package }}" 4 "fts5 sqlite_vec" "${{ matrix.test_timeout }}" "sharded-${{ matrix.name }}"
    - name: Upload test events
      if: failure() || github.run_attempt > 1
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-sharded-${{ matrix.name }}-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/*.json
        retention-days: 14
        if-no-files-found: ignore
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
  test-macos-15:
    if: '(github.event_name == ''push'' || inputs.subset == ''all'') && (github.event_name != ''push'' || !startsWith(github.event.head_commit.message, ''ci: prepare cache publication'') && !startsWith(github.event.head_commit.message, ''ci: publish retained measurement caches''))'
    runs-on: macos-26
    timeout-minutes: 79
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Download identical upstream snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/download-artifact@v8.0.1
      with:
        repository: kenn-io/msgvault
        run-id: 42398968927
        github-token: ${{ github.token }}
        name: go-snapshot-macos
        path: ${{ runner.temp }}/snapshot
    - name: Seed owner directories from snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        SNAPSHOT_GROUP: macos
      run: python3 .github/scripts/cache-measure-seed.py
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@main
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-macos
      if: matrix.variant == 'baseline'
    - name: Restore Go caches (candidate)
      uses: $/.github/actions/go-cache-restore
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-macos
        trim: 'true'
      if: matrix.variant == 'candidate'
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - name: Test
      run: make test TEST_TIMEOUT=39m
    - name: Check for test reruns
      if: always()
      id: check-reruns
      shell: bash
      run: |
        for report in gotestsum/*-reruns.txt; do
          if [ -s "$report" ]; then
            echo "reruns=true" >> "$GITHUB_OUTPUT"
            break
          fi
        done
    - name: Upload test events
      if: failure() || github.run_attempt > 1 || steps.check-reruns.outputs.reruns == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: gotestsum-macos-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: gotestsum/*.json
        retention-days: 14
        if-no-files-found: ignore
    - name: Save Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-save@main
      if: matrix.variant == 'baseline'
    - name: Save Go caches (candidate)
      uses: $/.github/actions/go-cache-save
      if: matrix.variant == 'candidate'
    - name: Verify published candidate cache
      id: cache-published
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.GO_CACHE_PATHS }}
        key: ${{ env.GO_CACHE_KEY }}
        lookup-only: true
    - name: Preserve candidate output when cache publication fails
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      shell: bash
      env:
        SNAPSHOT_GROUP: macos
      run: python3 .github/scripts/cache-measure-pack.py
    - name: Upload unpublished candidate cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-published.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: go-produced-99cc6603d8-macos
        path: ${{ runner.temp }}/produced-cache/*
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["candidate"]' || format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
  frontend:
    if: '(github.event_name != ''push'' && (inputs.subset == ''shared'' || inputs.subset == ''all'')) && (github.event_name != ''push'' || !startsWith(github.event.head_commit.message, ''ci: prepare cache publication'') && !startsWith(github.event.head_commit.message, ''ci: publish retained measurement caches''))'
    runs-on: ubuntu-26.04
    timeout-minutes: 33
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Free measurement space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@main
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-linux-test
      if: matrix.variant == 'baseline'
    - name: Restore Go caches (candidate)
      uses: $/.github/actions/go-cache-restore
      with:
        group: measure-20261107-${{ matrix.variant == 'candidate' && '99cc6603d8' || 'fixed' }}-${{ matrix.variant }}-linux-test
      if: matrix.variant == 'candidate'
    - name: Measure restored cache directories
      shell: bash
      run: python3 .github/scripts/cache-measure-sizes.py
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 26.13.0
    - uses: step-security/setup-bun@v2.1.3
      with:
        bun-version-file: web/package.json
    - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.2
    - name: Install frontend dependencies
      run: DOWNLOAD_RETRY='kit-retry 3 5' make web-install
    - name: Start browser server
      id: browser-server
      timeout-minutes: 10
      working-directory: web
      run: |
        version=$(node -p "require('@playwright/test/package.json').version")
        image="mcr.microsoft.com/playwright:v$version-noble"
        cli=$(node -p "require.resolve('@playwright/test/cli')")
        kit-retry 3 5 docker pull "$image"
        container_id=$(docker run --detach --interactive --init --network host --ipc host \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
          --workdir "$GITHUB_WORKSPACE/web" \
          "$image" node "$cli" run-server --host 127.0.0.1 --port 3000)
        echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
        # Allow slow container startup to finish while polling for readiness.
        for attempt in {1..120}; do
          if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
            echo 'Browser server container exited before becoming ready.' >&2
            exit 1
          fi
          # workflowretry: allow Poll the local service for readiness.
          if curl --fail --silent --output /dev/null --max-time 2 http://127.0.0.1:3000/json; then
            exit 0
          fi
          sleep 1
        done
        echo 'Browser server did not become ready within 120 attempts.' >&2
        exit 1
    - name: Check and test frontend
      run: make web-check web-test
    - name: Upload Vitest report
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: vitest-unit-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: web/test-results/vitest/unit.json
        retention-days: 14
        if-no-files-found: ignore
    - name: Precompile e2e archive fixture
      run: go test -tags "fts5 sqlite_vec" -run '^$' -count=1 ./internal/query
    - name: Run deterministic browser and visual tests
      env:
        PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
        MSGVAULT_PLAYWRIGHT_SUITE: browser
      run: make web-test-browser
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: playwright-browser-attempt-${{ github.run_attempt }}-${{ matrix.variant }}
        path: web/test-results/playwright/browser.json
        retention-days: 14
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v7.0.2
      if: failure()
      with:
        name: playwright-browser-failures-${{ matrix.variant }}
        path: |
          web/playwright-report
          web/test-results
        if-no-files-found: ignore
    - name: Stop browser server
      if: always() && steps.browser-server.outputs.container_id != ''
      env:
        CONTAINER_ID: ${{ steps.browser-server.outputs.container_id }}
      run: |
        docker logs "$CONTAINER_ID" || true
        docker rm --force "$CONTAINER_ID"
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["candidate"]' || format('["{0}"]', inputs.variant || 'candidate')) }}
    env:
      MEASURE_VARIANT: ${{ matrix.variant }}
  test-windows:
    runs-on: windows-2025
    timeout-minutes: 47
    steps:
    - uses: actions/checkout@v7.0.1
    - &id002
      name: Set cache and scratch paths
      shell: pwsh
      run: |
        $paths = @{ GOCACHE = 'go-build'; GOMODCACHE = 'go-mod'; GOTMPDIR = 'go-tmp'; TEMP = 'test-tmp'; TMP = 'test-tmp'; GOLANGCI_LINT_CACHE = 'golangci-lint' }
        foreach ($entry in $paths.GetEnumerator()) {
          $path = Join-Path $env:RUNNER_TEMP $entry.Value
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          "$($entry.Key)=$path" >> $env:GITHUB_ENV
        }
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Download identical upstream snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/download-artifact@v8.0.1
      with:
        repository: kenn-io/msgvault
        run-id: 42399332998
        github-token: ${{ github.token }}
        name: go-snapshot-windows
        path: ${{ runner.temp }}/snapshot
    - name: Seed owner directories from snapshot
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        SNAPSHOT_GROUP: windows
      run: python3 .github/scripts/cache-measure-seed.py
    - name: Restore Go caches (baseline)
      uses: kenn-io/msgvault/.github/actions/go-cache-restore@main
      with:
